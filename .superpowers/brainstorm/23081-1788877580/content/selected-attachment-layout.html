<style>
  .choices { display:grid; grid-template-columns:repeat(2,minmax(300px,1fr)); gap:24px; margin-top:24px; }
  .choice { cursor:pointer; border:2px solid var(--border); border-radius:18px; overflow:hidden; background:var(--card-bg); transition:.18s ease; }
  .choice:hover { border-color:var(--accent); transform:translateY(-2px); }
  .demo { min-height:270px; padding:30px 20px; display:flex; align-items:flex-end; background:linear-gradient(180deg,#fafafa,#f1f3f6); box-sizing:border-box; }
  .composer-shell { width:100%; border-radius:22px; background:white; padding:10px; box-shadow:0 5px 22px rgba(0,0,0,.11); }
  .attachments { display:flex; gap:8px; margin-bottom:10px; overflow:hidden; }
  .thumb { position:relative; width:58px; height:58px; flex:none; border-radius:10px; background:linear-gradient(145deg,#506b8a,#d8b98b); }
  .file { position:relative; height:50px; max-width:175px; flex:none; border-radius:10px; padding:8px 28px 8px 10px; box-sizing:border-box; background:#f2f4f6; font-size:9px; }
  .file b { display:block; font-size:10px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .remove { position:absolute; right:-4px; top:-4px; width:18px; height:18px; border-radius:50%; background:#333; color:white; font-size:11px; display:grid; place-items:center; border:2px solid white; }
  .input { height:32px; display:flex; align-items:center; justify-content:space-between; color:#a6a9af; font-size:11px; }
  .buttons { display:flex; gap:10px; color:#30343a; font-size:16px; }
  .inline { height:54px; display:flex; align-items:center; gap:10px; }
  .inline .file { flex:1; max-width:none; }
  .copy { padding:0 22px 22px; } .copy h3 { margin:0 0 8px; } .copy p { margin:0; color:var(--muted); line-height:1.5; }
  @media(max-width:760px){.choices{grid-template-columns:1fr}}
</style>

<h2>已选附件放在哪里？</h2>
<p class="subtitle">两种方案都不显示面板里的“最近照片列表”，只展示用户真正选中的附件，并支持逐个删除。</p>

<div class="choices">
  <div class="choice" data-choice="attachment-strip-above-input" onclick="toggleSelect(this)">
    <div class="demo">
      <div class="composer-shell">
        <div class="attachments">
          <div class="thumb"><span class="remove">×</span></div>
          <div class="file"><b>腾讯控股财报.pdf</b>2.4 MB<span class="remove">×</span></div>
        </div>
        <div class="input"><span>针对附件提问…</span><span class="buttons">＋　↑</span></div>
      </div>
    </div>
    <div class="copy"><h3>A · 输入框内上方附件条（推荐）</h3><p>图片缩略图与文件卡片并排，可横向扩展；附件、问题和发送动作的关系最清楚。</p></div>
  </div>

  <div class="choice" data-choice="single-compact-summary" onclick="toggleSelect(this)">
    <div class="demo">
      <div class="composer-shell">
        <div class="inline">
          <div class="file"><b>已添加 2 个附件</b>图片 1 · PDF 1<span class="remove">×</span></div>
          <span class="buttons">＋　↑</span>
        </div>
      </div>
    </div>
    <div class="copy"><h3>B · 单行汇总</h3><p>更省高度，但看不到每个附件的类型和名称，也难以单独删除或确认误选。</p></div>
  </div>
</div>
