org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx3072M"
org.gradle.caching=true
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# 鸿蒙 hvigor 嵌入式调用 Gradle 时需 JDK 21（JDK 25/26 会让 Kotlin 2.0.21-KBA-010 失败）。
# 本机路径不要写进仓库：放到 ~/.gradle/gradle.properties，例如
#   org.gradle.java.home=/path/to/jbr-21/Contents/Home

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Kuikly 版本规则：${kuiklyVersion}-${kotlinVersion}
KUIKLY_VERSION=2.15.0-2.1.21
KUIKLY_MARKDOWN_VERSION=1.0.6-2.1.21
KUIKLY_KLINE_VERSION=0.1.0-2.1.21
